server {
      listen 80;
      server_name localhost;

      # 静态文件根目录（Docker 容器内的路径）
      root /usr/share/nginx/html;
      index index.html;

      # 所有请求：先找文件 → 找不到目录 → 兜底回 index.html
      # 你的项目是 hash 路由其实用不到，但留着无害，将来切 history 模式直接可用
      location / {
          try_files $uri $uri/ /index.html;
      }

      # 静态资源长缓存：文件名带 hash，内容变了文件名会变，缓存 30 天没问题
      location /assets/ {
          expires 30d;
          add_header Cache-Control "public, immutable";
      }

      # gzip 实时压缩（传输体积减少约 70%）
      gzip on;
      gzip_static on;
      gzip_min_length 1k;
      gzip_types text/css application/javascript application/json image/svg+xml;
  }
